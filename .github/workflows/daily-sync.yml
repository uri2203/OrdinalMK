# ═══════════════════════════════════════════════════════
# OrdinalMK — Multi-Project Daily Marketing
# Runs daily, generates content for ALL projects
# Each project gets its own content, landing pages, SEO
# ═══════════════════════════════════════════════════════

name: Daily Marketing — All Projects

on:
  schedule:
    - cron: '0 3 * * *'  # Every day at 3am UTC
  workflow_dispatch:
    inputs:
      project:
        description: 'Project ID (leave empty for all)'
        required: false
        default: ''

jobs:
  marketing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests pyyaml
      
      - name: Run multi-project orchestrator
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Token (PAT) con acceso de ESCRITURA a los repos de marca
          # (uri2203/tuialista-site, uri2203/yayika, …). Necesario para publicar
          # las landings bajo /lp/ en cada dominio. Sin él, el paso de deploy se
          # salta (no falla). Define ORDINALMK_DRY_RUN=1 para validar sin publicar.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "${{ github.event.inputs.project }}" ]; then
            python engine/multi_orchestrator.py run-project -p ${{ github.event.inputs.project }}
          else
            python engine/multi_orchestrator.py run
          fi
      
      - name: Commit and push changes
        run: |
          git config user.name "OrdinalMK Bot"
          git config user.email "bot@ordinalmk.dev"
          git add docs/data/ docs/projects/ published/ logs/
          git diff --staged --quiet || git commit -m "marketing: $(date +'%Y-%m-%d') — all projects"
          git push
