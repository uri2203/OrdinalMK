<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>OrdinalMK — Movido al panel</title>
  <meta http-equiv="refresh" content="3; url=https://ordinalmk-panel.onrender.com/">
  <style>
    :root{--bg:#0b0d13;--surface:#161a24;--line:#252b3b;--text:#e6e8f0;--muted:#8a90a6;--accent:#6d5efc;--accent2:#38bdf8}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);
      min-height:100vh;display:grid;place-items:center;padding:1.5rem}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2.2rem 2rem;max-width:440px;text-align:center}
    .logo{width:54px;height:54px;border-radius:14px;margin:0 auto 1rem;background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:grid;place-items:center;font-size:1.5rem;color:#fff}
    h1{font-size:1.35rem;margin-bottom:.6rem;font-weight:700}
    p{color:var(--muted);font-size:.95rem;line-height:1.6;margin-bottom:1.3rem}
    a.btn{display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
      text-decoration:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:600}
    .foot{margin-top:1.2rem;font-size:.78rem;color:#5b6178}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">◆</div>
    <h1>Este panel se mudó</h1>
    <p>El antiguo tablero fue reemplazado por el <strong>panel de control OrdinalMK</strong>:
       datos reales, login seguro y la analítica SEO integrada, todo en un solo lugar.</p>
    <a class="btn" href="https://ordinalmk-panel.onrender.com/">Ir al panel →</a>
    <div class="foot">Te redirigimos automáticamente en unos segundos…</div>
  </div>
  <script>setTimeout(function(){location.href='https://ordinalmk-panel.onrender.com/';}, 3000);</script>
</body>
</html>
