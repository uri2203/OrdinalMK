# ═══════════════════════════════════════════════════════
# GLOBAL SETTINGS
# ═══════════════════════════════════════════════════════
engine:
  name: OrdinalMK
  version: "1.0"
  
  # Scheduler
  schedule:
    timezone: America/Mexico_City
    content_generation: "0 3 * * *"      # Daily 3am UTC
    email_campaigns: "0 14 * * 1,3,5"    # Mon/Wed/Fri 2pm UTC
    seo_audit: "0 6 * * 1"              # Monday 6am UTC
    monthly_report: "0 8 1 * *"         # 1st of month 8am
  
  # Rate Limits
  limits:
    articles_per_day: 2
    emails_per_hour: 50
    landing_pages_per_week: 3
  
  # API Keys (loaded from env)
  apis:
    stripe: ${STRIPE_SECRET_KEY}
    resend: ${RESEND_API_KEY}
    supabase_url: ${SUPABASE_URL}
    supabase_key: ${SUPABASE_ANON_KEY}
    plausible: ${PLAUSIBLE_API_KEY}
    google_search_console: ${GSC_CREDENTIALS}
