# OrdinalMK — Panel de control (despliegue en Render)
# Backend Flask con login real. Corre el panel 24/7 en un servidor.
services:
  - type: web
    name: ordinalmk-panel
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt anthropic google-api-python-client google-auth
    startCommand: gunicorn panel:app --bind 0.0.0.0:$PORT
    healthCheckPath: /login
    # Disco persistente: sin esto, los prospectos/held/reportes se pierden al
    # reiniciar (el filesystem de Render es efímero). Con disco, se conservan.
    disk:
      name: ordinalmk-data
      mountPath: /opt/render/project/src/reports
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ORDINALMK_PANEL_PASSWORD   # contraseña del panel (ponla fuerte)
        sync: false
      - key: ANTHROPIC_API_KEY          # contenido con IA
        sync: false
      - key: GOOGLE_PLACES_API_KEY      # descubrir prospectos
        sync: false
      - key: RESEND_API_KEY             # enviar emails/outreach
        sync: false
      - key: GSC_CREDENTIALS            # ruta a service-account.json (medición)
        sync: false
      - key: GH_TOKEN                   # PAT para publicar en repos de marca
        sync: false
