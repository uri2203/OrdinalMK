# OrdinalMK — Daily Marketing Automation
# Runs every day at 3am UTC (9pm Mexico time)
# 1. Syncs data from Stripe, Resend, Supabase
# 2. Runs marketing automation (content, SEO, landing pages, email)

name: Daily Marketing

on:
  schedule:
    - cron: '0 3 * * *'  # Every day at 3am UTC
  workflow_dispatch:      # Manual trigger button

jobs:
  marketing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Sync data (Stripe, Resend, Supabase)
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python sync.py
      
      - name: Run marketing automation
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python engine/orchestrator.py yayika
      
      - name: Commit and push all changes
        run: |
          git config user.name "OrdinalMK Bot"
          git config user.email "bot@ordinalmk.dev"
          git add docs/data/ published/ logs/
          git diff --staged --quiet || git commit -m "marketing: daily automation $(date +'%Y-%m-%d')"
          git push
