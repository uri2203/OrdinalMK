# ═══════════════════════════════════════════════════════
# OrdinalMK — Multi-Project Configuration
# Each project defines its own identity, content, and channels
# ═══════════════════════════════════════════════════════

projects:

  # ─────────────────────────────────────────────────────
  # YAYIKA — Plataforma para mujeres emprendedoras
  # ─────────────────────────────────────────────────────
  yayika:
    name: Yayika
    domain: yayika.com
    github_repo: uri2203/yayika
    concept: "Plataforma para mujeres emprendedoras"
    tagline: "Transforma tu vida con Yayika"
    audience:
      demographic: "Mujeres 25-45 años"
      location: "Latinoamerica, España, Brasil"
      interests: ["emprendimiento", "salud", "productividad", "comunidad"]
      pain_points:
        - "No tienen claridad sobre su ciclo menstrual"
        - "Les cuesta organizar su vida y negocios"
        - "Sienten que están solas en su camino emprendedor"
        - "No encuentran productos digitales hechos para ellas"
    
    languages: [es, en, pt, fr, de]
    primary_language: es
    timezone: America/Mexico_City
    
    # Content Strategy
    content:
      topics:
        es:
          - "Como trackear tu ciclo menstrual para mejorar tu productividad"
          - "5 estrategias para mujeres emprendedoras en 2026"
          - "Guia completa: planificador digital para mujeres"
          - "Beneficios de una comunidad de mujeres emprendedoras"
          - "Como organizar tu vida con un planner digital"
          - "Menstruacion y trabajo: tips para productividad"
          - "Productos digitales que toda mujer necesita"
          - "Como empezar tu negocio siendo mujer en Latinoamerica"
          - "Salud menstrual: lo que nadie te cuenta"
          - "Networking para mujeres: como crear tu circulo de apoyo"
          - "Balance vida-mujer-emprendedora: guia practica"
          - "Como precios tu productos digitales como mujer"
        en:
          - "How to track your menstrual cycle for better productivity"
          - "5 strategies for women entrepreneurs in 2026"
          - "Complete guide: digital planner for women"
          - "Benefits of a women entrepreneur community"
          - "How to organize your life with a digital planner"
          - "Menstruation and work: productivity tips"
          - "Digital products every woman needs"
        pt:
          - "Como rastrear seu ciclo menstrual para melhor produtividade"
          - "5 estrategias para mulheres empreendedoras em 2026"
          - "Guia completo: planejador digital para mulheres"
        fr:
          - "Comment suivre votre cycle menstruel pour une meilleure productivité"
          - "5 stratégies pour les femmes entrepreneures en 2026"
        de:
          - "Wie du deinen Menstruationszyklus für mehr Produktivität trackst"
          - "5 Strategien für Unternehmerinnen 2026"
      
      tone: "Cálido, empático, inspirador"
      style: "Práctico con tips accionables"
      cta: "Descubre Yayika"
    
    # Email Sequences
    email:
      from: "Yayika <marketing@yayika.com>"
      sequences:
        welcome:
          delay_hours: 0
          trigger: "Nueva suscripción"
          languages: [es, en, pt, fr, de]
        nurture:
          delay_hours: 48
          trigger: "48h después de welcome"
          languages: [es, en, pt, fr, de]
        upsell:
          delay_hours: 168
          trigger: "7 días después de nurture"
          languages: [es, en, pt, fr, de]
    
    # Products & Pricing
    products:
      - name: "Plan Semilla"
        price: 179
        currency: MXN
        stripe_link: "https://buy.stripe.com/00wcN502q0xY2481elgA80f"
        features: ["3 productos", "Comunidad básica", "Tracker de ciclo"]
      - name: "Plan Guerrera"
        price: 349
        currency: MXN
        stripe_link: "https://buy.stripe.com/14A4gzeXk0xY4cg3mtgA80g"
        features: ["Productos ilimitados", "Comunidad premium", "Mentoring mensual", "Sin comisiones"]
        popular: true
      - name: "Plan Diamante"
        price: 549
        currency: MXN
        stripe_link: "https://buy.stripe.com/cNi9ATdTgfsSbEI4qxgA80h"
        features: ["Todo de Guerrera", "Mentoring 1:1", "Soporte prioritario", "Todas las herramientas"]
    
    # Landing Pages
    landing_pages:
      - name: "Principal"
        slug: "/"
        headline: "Transforma tu vida con Yayika"
        subtitle: "La plataforma #1 para mujeres emprendedoras"
      - name: "Precios"
        slug: "/precios"
        headline: "Planes que se adaptan a ti"
        subtitle: "Desde $179/mes"
      - name: "Comunidad"
        slug: "/comunidad"
        headline: "Únete a miles de mujeres"
        subtitle: "Comunidad de apoyo y networking"
    
    # SEO
    seo:
      target_keywords:
        es: ["tracker ciclo menstrual", "planificador mujeres", "productos digitales mujeres", "comunidad mujeres emprendedoras"]
        en: ["menstrual cycle tracker", "women planner", "digital products women"]
        pt: ["rastreador ciclo menstrual", "planejador mulheres"]
    
    # GitHub Pages
    deploy:
      repo: uri2203/yayika
      branch: main
      folder: "/"
      auto_deploy: true

